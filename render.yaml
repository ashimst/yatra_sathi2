services:
  # Backend FastAPI Web Service
  - type: web
    name: yatrasathi-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: yatrasathi-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OSRM_URL
        value: https://router.project-osrm.org

  # Frontend Web Static Site
  - type: web
    name: yatrasathi-web
    env: static
    region: oregon
    plan: free
    rootDir: web
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: yatrasathi-backend
          property: host

databases:
  - name: yatrasathi-db
    region: oregon
    plan: free
    postgresMajorVersion: 16
